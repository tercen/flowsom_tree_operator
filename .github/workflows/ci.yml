name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flowsom_tree_operator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Every plot renders from a real FlowSOM model
        run: docker run --rm -v "$PWD/ci:/c" --entrypoint Rscript flowsom_tree_operator:ci /c/smoke.R
      - name: main.R parses
        run: docker run --rm --entrypoint Rscript flowsom_tree_operator:ci -e 'invisible(parse("/operator/main.R"))'
